name: Firebase Functions CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: cd firebase/functions && npm ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Dependency Security Audit
        run: cd firebase/functions && npm audit --audit-level=critical

      - name: Run tests
        run: cd firebase/functions && npm run test:coverage

      - name: Run Firestore and Storage rules tests
        run: cd firebase/functions && npm run test:rules

      - name: Build
        run: cd firebase/functions && npm run build

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LANDSURVEY_EBB3B }}

      - name: Deploy Firestore rules and indexes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project landsurvey-ebb3b \
            --config firebase/firebase.json \
            --non-interactive
