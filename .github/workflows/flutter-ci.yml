name: Flutter CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: cd mobile && flutter pub get

      - name: Format code
        run: cd mobile && dart format --set-exit-if-changed .

      - name: Analyze project source
        run: cd mobile && flutter analyze

      - name: Run tests
        run: cd mobile && flutter test

      - name: Build debug-signed release validation APK
        working-directory: mobile
        env:
          ALLOW_DEBUG_RELEASE_SIGNING: "true"
        run: flutter build apk --release

      - name: Upload release validation APK
        uses: actions/upload-artifact@v4
        with:
          name: field-data-hub-debug-signed-release-validation-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
