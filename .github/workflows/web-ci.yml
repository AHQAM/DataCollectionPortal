name: Admin Web CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency Security Audit
        run: npm audit --audit-level=critical

      - name: Typecheck
        run: npm run typecheck

      - name: Check Formatting
        run: npm run format:check

      - name: Test
        run: npm run test:coverage
        env:
          VITE_FIREBASE_API_KEY: ci-test-api-key
          VITE_FIREBASE_AUTH_DOMAIN: ci-test.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-test-project
          VITE_FIREBASE_STORAGE_BUCKET: ci-test-project.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          VITE_FIREBASE_APP_ID: 1:123456789:web:ci-test
          VITE_FIREBASE_DATABASE_ID: ci-test-database
          VITE_RECAPTCHA_V3_SITE_KEY: ci-test-recaptcha-key
          VITE_RECAPTCHA_PROVIDER: v3
          VITE_APP_VERSION: "1.0.0"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Smoke Tests
        run: npm run test:e2e
        env:
          VITE_FIREBASE_API_KEY: ci-test-api-key
          VITE_FIREBASE_AUTH_DOMAIN: ci-test.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-test-project
          VITE_FIREBASE_STORAGE_BUCKET: ci-test-project.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          VITE_FIREBASE_APP_ID: 1:123456789:web:ci-test
          VITE_FIREBASE_DATABASE_ID: ci-test-database
          VITE_RECAPTCHA_V3_SITE_KEY: ci-test-recaptcha-key
          VITE_RECAPTCHA_PROVIDER: v3
          VITE_APP_VERSION: "1.0.0"

      - name: Build pull request
        if: github.event_name == 'pull_request'
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-test-api-key
          VITE_FIREBASE_AUTH_DOMAIN: ci-test.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-test-project
          VITE_FIREBASE_STORAGE_BUCKET: ci-test-project.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          VITE_FIREBASE_APP_ID: 1:123456789:web:ci-test
          VITE_FIREBASE_DATABASE_ID: ci-test-database
          VITE_RECAPTCHA_V3_SITE_KEY: ci-test-recaptcha-key
          VITE_RECAPTCHA_PROVIDER: v3
          VITE_APP_VERSION: "1.0.0"

      - name: Build production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_RECAPTCHA_PROVIDER: enterprise
          VITE_APP_VERSION: "1.0.0"

      - name: Deploy to Firebase Hosting
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_LANDSURVEY_EBB3B }}"
          channelId: live
          projectId: landsurvey-ebb3b
          entryPoint: firebase
