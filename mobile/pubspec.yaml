name: mobile
description: A new Flutter project for DataCollectionPortal Rep App.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  cloud_functions: any
  firebase_messaging: any
  firebase_crashlytics: any
  firebase_storage: any
  shared_preferences: ^2.2.1
  flutter_secure_storage: any
  flutter_riverpod: any
  riverpod_annotation: any
  go_router: any
  device_info_plus: any
  connectivity_plus: any
  geolocator: any
  image_picker: ^1.1.0
  signature: ^6.4.0
  uuid: ^4.3.0
  intl: ^0.20.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^4.0.9
  mocktail: ^1.0.5
  freezed: ^4.0.1
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  generate: true
